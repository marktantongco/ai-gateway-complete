<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; padding: 16px; font-family: -apple-system, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 6px;
             background: #1a1a2e; color: #fff; font-size: 13px; cursor: pointer; }
    button:hover { background: #16213e; }
    #status { margin-top: 12px; font-size: 12px; color: #666; word-break: break-all; }

    .error { color: #e74c3c; }
  </style>
</head>
<body>
  <h1>Grok/X Cookie Export</h1>
