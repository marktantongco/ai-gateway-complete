<link rel="stylesheet" href="components/section-providers.css">
<!-- Provider Pools Section -->
<section id="providers" class="section" aria-labelledby="providers-title">
    <h2 id="providers-title" data-i18n="providers.title">Provider Pool Management</h2>
    <div class="pool-description">
        <div class="highlight-note">
            <i class="fas fa-info-circle"></i>
            <span data-i18n="providers.note">Using default path configuration requires adding an empty node</span>
        </div>
    </div>
    <!-- Provider Pool Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-server"></i>
            </div>
            <div class="stat-info">
                <h3 id="activeConnections">0</h3>
                <p data-i18n="providers.activeConnections">Active Connections</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-network-wired"></i>
            </div>
            <div class="stat-info">
                <h3 id="activeProviders">0</h3>
                <p data-i18n="providers.activeProviders">Active Providers</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="stat-info">
                <h3 id="healthyProviders">0</h3>
                <p data-i18n="providers.healthyProviders">Healthy Providers</p>
            </div>
        </div>
    </div>

    <!-- Provider Search Bar -->
    <div class="search-bar" style="margin-bottom: 20px;">
        <div class="search-input-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="providerSearchInput" data-i18n-placeholder="providers.searchPlaceholder" placeholder="Search provider name or node content...">
        </div>
    </div>

    <div id="providers-header-actions" class="header-actions" style="margin-bottom: 15px; display: flex; justify-content: flex-end;">
        <!-- The Add Group button has been moved to the end of providersList -->
    </div>
    <div class="providers-container">
        <div id="providersList" class="providers-list">
            <!-- Providers will be loaded here -->
        </div>
    </div>
</section>
