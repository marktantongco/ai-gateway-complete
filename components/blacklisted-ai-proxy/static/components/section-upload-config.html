<link rel="stylesheet" href="components/section-upload-config.css">
<!-- Upload Configuration Section -->
<section id="upload-config" class="section" aria-labelledby="upload-config-title">
    <h2 id="upload-config-title" data-i18n="upload.title">Credential Files Management</h2>
    <div class="upload-config-panel">
        <!-- Search and Filter Area -->
        <div class="config-search-panel">
            <div class="search-controls">
                <div class="form-group">
                    <label for="configSearch" data-i18n="upload.search">Search Configuration</label>
                    <div class="search-input-group">
                        <input type="text" id="configSearch" class="form-control" data-i18n-placeholder="upload.searchPlaceholder" placeholder="Enter file name">
                        <button type="button" class="btn btn-outline" id="searchConfigBtn" data-i18n-title="common.search" aria-label="SearchConfiguration" data-i18n-aria-label="common.search">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="configProviderFilter" data-i18n="upload.providerFilter">Provider Type</label>
                    <select id="configProviderFilter" class="form-control">
                        <option value="" data-i18n="upload.providerFilter.all">AllProvider</option>
                        <!-- Options will be dynamically populated by provider-manager.js -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="configStatusFilter" data-i18n="upload.statusFilter">Link Status</label>
                    <select id="configStatusFilter" class="form-control">
                        <option value="" data-i18n="upload.statusFilter.all">AllStatus</option>
                        <option value="used" data-i18n="upload.statusFilter.used">Linked</option>
                        <option value="unused" data-i18n="upload.statusFilter.ununused">Unlinked</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Configuration List -->
        <div class="config-list-container">
            <div class="config-list-header">
                <h3 data-i18n="upload.listTitle">Configuration File List</h3>
                <div class="config-stats">
                    <span id="configCount" data-i18n="upload.count" data-i18n-params='{"count":"0"}'>Total 0 configuration files</span>
                    <span id="usedConfigCount" class="status-used" data-i18n="upload.usedCount" data-i18n-params='{"count":"0"}'>Linked: 0</span>
                    <span id="unusedConfigCount" class="status-unused" data-i18n="upload.unusedCount" data-i18n-params='{"count":"0"}'>Unlinked: 0</span>
                    <button id="batchLinkKiroBtn" class="btn-batch-link" data-i18n-title="upload.batchLink" title="Batch link unlinked configurations under configs/">
                        <i class="fas fa-link"></i> <span data-i18n="upload.batchLink">Auto Link OAuth</span>
                    </button>
                    <button id="deleteUnboundBtn" class="btn-delete-unbound" data-i18n-title="upload.deleteUnbound" title="Delete all unlinked configuration files">
                        <i class="fas fa-trash-alt"></i> <span data-i18n="upload.deleteUnbound">Delete Unlinked</span>
                    </button>
                    <button class="btn-refresh" id="refreshConfigList" aria-label="Refresh Config List" data-i18n-aria-label="upload.refresh">
                        <i class="fas fa-sync-alt"></i> <span data-i18n="upload.refresh">Refresh</span>
                    </button>
                    <button class="btn-download" id="downloadAllConfigs" aria-label="Download All Configs" data-i18n-aria-label="upload.downloadAll">
                        <i class="fas fa-file-archive"></i> <span data-i18n="upload.downloadAll">Download All</span>
                    </button>
                </div>
            </div>
            <div id="configList" class="config-list">
                <!-- Configuration files list will be dynamically generated here -->
            </div>
        </div>
    </div>
</section>
