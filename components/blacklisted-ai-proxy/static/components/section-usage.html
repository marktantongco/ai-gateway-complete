<link rel="stylesheet" href="components/section-usage.css">
<!-- Usage Section -->
<section id="usage" class="section" aria-labelledby="usage-title">
    <h2 id="usage-title" data-i18n="usage.title">Usage Query</h2>
    <div class="usage-panel">
        <div class="usage-controls">
            <button class="btn btn-primary" id="refreshUsageBtn" aria-label="Refresh Usage" data-i18n-aria-label="usage.refresh">
                <i class="fas fa-sync-alt"></i> <span data-i18n="usage.refresh">Refresh Usage</span>
            </button>
            <span class="usage-last-update" id="usageLastUpdate" data-i18n="usage.lastUpdate" data-i18n-params='{"time":"--"}'>Last updated: --</span>
            <span class="server-time-display" id="serverTimeDisplay">
             <span data-i18n="usage.serverTime">Server Time</span>: <span id="serverTimeValue">--</span>
            </span>
        </div>

        <div class="usage-info-banner">
            <i class="fas fa-info-circle"></i>
            <span data-i18n="usage.supportedProvidersPrefix">Providers supporting usage query:</span>
            <span id="supportedProvidersList" class="supported-providers-tags">
                <span class="loading-inline"><i class="fas fa-spinner fa-spin"></i></span>
            </span>
        </div>
        
        <div class="usage-loading" id="usageLoading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i> <span data-i18n="usage.loading">Loading usage data...</span>
        </div>
        
        <div class="usage-error" id="usageError" style="display: none;">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="usageErrorMessage"></span>
        </div>
        
        <div class="usage-content" id="usageContent">
            <!-- Usage data will be dynamically generated here -->
            <div class="usage-empty" id="usageEmpty">
                <i class="fas fa-chart-bar"></i>
                <p data-i18n="usage.empty">Click the "Refresh Usage" button to fetch credential file usage information</p>
            </div>
        </div>
    </div>
</section>
